<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>റെട്രോ കാസറ്റ് പ്ലെയർ</title>
    <style>
        body {
            background-color: #121212;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .cassette {
            width: 260px;
            height: 160px;
            background: #222;
            border: 4px solid #444;
            border-radius: 12px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }
        .reel-container {
            display: flex;
            gap: 50px;
            background: #111;
            padding: 15px 30px;
            border-radius: 8px;
            border: 2px dashed #555;
        }
        .reel {
            width: 45px;
            height: 45px;
            border: 5px solid #00ffcc;
            border-radius: 50%;
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .screen {
            margin-top: 25px;
            width: 300px;
            height: 80px;
            background: #000;
            border: 2px solid #00ffcc;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            font-size: 14px;
            word-break: break-all;
            text-shadow: 0 0 5px #00ffcc;
        }
        button {
            margin-top: 20px;
            background: #00ffcc;
            color: #121212;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        button:active {
            background: #008866;
        }
    </style>
</head>
<body>

    <div class="cassette">
        <div class="reel-container">
            <div class="reel"></div>
            <div class="reel"></div>
        </div>
    </div>

    <div class="screen" id="displayScreen">റെട്രോ കാസറ്റ് സിഗ്നൽ ലോഡിങ്ങിനായി തയ്യാറാണ്... പ്ലേ അമർത്തൂ!</div>
    
    <button onclick="playMessage()">പ്ലേ ചെയ്യുക (Play)</button>

    <script>
        function playMessage() {
            const screen = document.getElementById('displayScreen');
            screen.innerHTML = "";
            let message = "ലോകത്തിന്റെ ഏത് കോണിൽ നിന്നുമുള്ള രഹസ്യ സന്ദേശം: ഹലോ! ഇത് പഴയകാല കാസറ്റ് സിഗ്നൽ മെസ്സേജാണ്...";
            let i = 0;
            
            function typeWriter() {
                if (i < message.length) {
                    screen.innerHTML += message.charAt(i);
                    i++;
                    setTimeout(typeWriter, 70);
                }
            }
            typeWriter();
        }
    </script>
</body>
</html>
